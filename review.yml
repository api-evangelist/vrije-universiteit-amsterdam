reviews:
  - date: '2026-08-30'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES a
      surface before saving any contract. The 26 OpenAPIs this repository held under VU's name
      were one document: Elsevier's Pure API v5.34.3 (info.title "Pure API", contact
      pure-support@elsevier.com), the same product contract at least nine other universities in
      this catalog ship, split per tag by our own refine step into 26 apparent APIs and 70
      derived artifacts. All 96 files were removed; no contract replaced them, because VU
      authors none. What survived the ownership check, and what the June 2026 review missed, is
      two genuinely institution-operated machine-readable surfaces. The OAI-PMH 2.0 endpoint at
      research.vu.nl/ws/oai is not just present but fully harvestable — Identify,
      ListMetadataFormats, ListSets and a 108KB ListRecords pull of OpenAIRE CERIF person
      records all returned 200. And VU publishes signed SAML 2.0 identity-provider metadata at
      stsfed.login.vu.nl (entityID http://stsfed.login.vu.nl/adfs/services/trust), carried in
      the SURFconext national IdP feed with scope vu.nl and republished to eduGAIN; the June
      review concluded "no identity API was found", which was wrong. Two DataCite repository
      clients are registered to VU and actively minting (DELFT.VUDATA "VU Yoda", 171 DOIs;
      YAJD.TKSCOO "VU Research Portal", 34 DOIs). Three further tenant surfaces were found that
      the June review also missed: VU Yoda at portal.yoda.vu.nl (Utrecht University software
      maintained by SURF for VU), Instructure Canvas at canvas.vu.nl, and Semestry MyTimetable
      at rooster.vu.nl — all live, all credential-gated, all vendor contracts. Rating moves
      2 -> 3 on discovered surface, not on published contract: VU still operates no developer
      program, no API portal, no llms.txt and no security.txt.
