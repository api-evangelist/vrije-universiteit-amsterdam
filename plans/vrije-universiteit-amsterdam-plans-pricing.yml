created: '2026-06-03'
modified: '2026-08-30'
reconciled: false
tags:
- Education
- Higher Education
- University
- Plans
description: >-
  Vrije Universiteit Amsterdam is a non-commercial higher-education institution and sells no API
  access. Nothing here is a product with a price. The OAI-PMH harvesting interface at
  research.vu.nl/ws/oai and the SAML federation metadata at stsfed.login.vu.nl are open and free
  to anyone. Everything else — the Elsevier Pure REST web service, Canvas, MyTimetable, Yoda —
  is gated by institutional affiliation or a vendor-issued key, not by payment, and the
  commercial relationship in each case is between VU and the vendor, not between VU and a
  developer.
notes: >-
  No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
sources:
- https://raw.githubusercontent.com/api-evangelist/vrije-universiteit-amsterdam/refs/heads/main/apis.yml
plans:
- id: vrije-universiteit-amsterdam-free-open
  name: Free / Open
  type: free
  description: Public open APIs (metadata, library, repository, course data) offered at no charge, generally for non-commercial use.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: vrije-universiteit-amsterdam-affiliation
  name: Affiliation / Credentialed
  type: free
  description: Administrative and identity APIs gated behind institutional SSO, client certificates, or federation membership rather than payment.
  entries:
