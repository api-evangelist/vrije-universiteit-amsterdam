  description: >-
    OAI-PMH 2.0 metadata harvesting endpoint for the Vrije Universiteit Amsterdam Repository, served by
    the institution's Elsevier Pure research information system at research.vu.nl. Confirmed live: an
    Identify request returns the repository name "Vrije Universiteit Amsterdam Repository" with admin
    contact pure.ub@vu.nl. Supports standard OAI-PMH verbs (Identify, ListMetadataFormats, ListRecords,
