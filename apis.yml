- aid: vrije-universiteit-amsterdam:yoda
  name: VU Yoda research data repository
  x-operator: tenant
  description: >-
    VU Amsterdam's research data management and publication platform, running at
    portal.yoda.vu.nl. Yoda is open-source iRODS-based software built by Utrecht University and,
    per its own DataCite registry record, "maintained by SURF for the Vrije Universiteit
    Amsterdam" — an institution-specific subdomain on a platform someone else operates, which
    makes VU the tenant rather than the operator. The portal returns HTTP 200 and gates behind
    /user/gate; the WebDAV data endpoint at data.yoda.vu.nl returns HTTP 401; published datasets
    land at publication.yoda.vu.nl, which currently answers every request with an Anubis bot
    challenge. Registered with DataCite as repository client DELFT.VUDATA and actively minting —
    171 DOIs as of 2026-08-30.
  humanURL: https://portal.yoda.vu.nl
  baseURL: https://data.yoda.vu.nl
