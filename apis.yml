description: >-
  Vrije Universiteit Amsterdam (VU Amsterdam) is a public research university in the Netherlands,
  founded in 1880 and ranked #221 in the QS World University Rankings 2025. It operates no public
  developer program, no API portal, and no first-party API contract: every OpenAPI previously
  attributed to VU in this repository was Elsevier's Pure API v5.34.3 (contact
  pure-support@elsevier.com), the same product contract at least nine other universities ship, and
  it has been removed. What VU genuinely operates and publishes machine-readably is two protocol
  surfaces on its own domain — a live OAI-PMH 2.0 repository interface at research.vu.nl/ws/oai
  serving OpenAIRE CERIF and Dublin Core, administered by the University Library, and a signed
  SAML 2.0 identity-provider metadata document at stsfed.login.vu.nl published into the SURFconext
  national federation and onward to eduGAIN. Everything else programmable under a vu.nl subdomain
  is a vendor product VU is the tenant of: the Elsevier Pure REST web service, VU Yoda (Utrecht
  University software maintained by SURF for VU), Instructure Canvas, and Semestry MyTimetable —
  all credential-gated. Research data is also published to the national DataverseNL service. The
  University Library GitHub organisation (ubvu) is the institution's active open-source presence
  with 90 public repositories; the official VU GitHub organisation has none.
