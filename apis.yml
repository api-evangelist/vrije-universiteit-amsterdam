apis:
- aid: vrije-universiteit-amsterdam:research-portal-oai
  name: VU Research Portal OAI-PMH
  x-operator: institution
  description: >-
    OAI-PMH 2.0 metadata harvesting interface for the Vrije Universiteit Amsterdam Repository,
    served from the institution's own domain and administered by the VU University Library
    (adminEmail pure.ub@vu.nl). Verified live 2026-08-30: Identify returns repositoryName
    "Vrije Universiteit Amsterdam Repository", earliestDatestamp 2017-02-05, granularity
    YYYY-MM-DDThh:mm:ssZ and an OpenAIRE CERIF Service description claiming compatibility 1.1.1.
    ListMetadataFormats advertises oai_dc and oai_cerif_openaire; ListSets advertises seven
    openaire_cris_* sets plus per-year publication sets back to 1880; a ListRecords harvest of
    openaire_cris_persons returned 108KB of CERIF records. The repository software underneath is
    Elsevier Pure, but OAI-PMH is an open protocol on a VU host, so the surface is the
    institution's even though the product is not. No OpenAPI is held for it because VU publishes
    none and this pipeline does not generate contracts on an institution's behalf.
  humanURL: https://research.vu.nl/
