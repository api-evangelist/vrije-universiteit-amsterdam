    "checking your connection" body rather than content, and research.vu.nl HTML pages sit
    behind a Cloudflare challenge (403) even though its /ws/ protocol endpoints are open.
    No developer portal, no llms.txt, no security.txt and no institution-authored API
    contract exists at any probed location. This profile is thin because the institution is a
    buyer, not a producer — not because the surface was unreachable.
