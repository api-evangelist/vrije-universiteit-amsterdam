- aid: vrije-universiteit-amsterdam:identity-federation
  name: VU Amsterdam SAML 2.0 identity provider (SURFconext / eduGAIN)
  x-operator: institution
  description: >-
    Vrije Universiteit Amsterdam operates its own SAML 2.0 identity provider on Microsoft ADFS and
    publishes signed, machine-readable federation metadata for it. entityID
    http://stsfed.login.vu.nl/adfs/services/trust; SingleSignOnService at
    https://stsfed.login.vu.nl/adfs/ls/; the metadata document carries both IDPSSODescriptor and
    SPSSODescriptor roles and supports SAML 2.0 alongside WS-Federation and WS-Trust. The same
    entity appears in the SURFconext national IdP feed with mdui:DisplayName "Vrije Universiteit
    Amsterdam" and shibmd:Scope vu.nl, from where SURFconext publishes it onward to eduGAIN. This
    is the surface a university operates by definition, it is genuinely first-party, and it was
    entirely absent from the June 2026 profile of this institution.
